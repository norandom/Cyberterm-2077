[package]
name = "warpeer_update"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow.workspace = true
semver.workspace = true
serde_json.workspace = true
tempfile.workspace = true
zipsign-api = { version = "=0.2.2" }
self_update = { version = "=1.3.3", default-features = false, features = ["ureq", "rustls", "github", "compression-tar-gz", "compression-zip-deflate", "signatures", "checksums"] }

[dev-dependencies]
tempfile.workspace = true
zipsign-api = { version = "=0.2.2", features = ["sign-tar", "sign-zip"] }
ed25519-dalek = "2.2"
flate2 = "1"
tar = "0.4"
zip.workspace = true

[target.'cfg(windows)'.dependencies]
self-replace = "1.5"
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_Foundation"] }
