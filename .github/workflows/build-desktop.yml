name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            arch: x86_64
            host: x86_64-unknown-linux-gnu
          - os: windows-2022
            platform: windows
            arch: x86_64
            host: x86_64-pc-windows-msvc
          - os: macos-15
            platform: macos
            arch: aarch64
            host: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      CARGO_BUILD_JOBS: ${{ matrix.platform == 'macos' && '1' || '2' }}
      CARGO_FULL_PROFILE: release-desktop
      CARGO_BIN_NAME: warpeer
      WARP_APP_NAME: Warpeer
      GIT_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          echo "LIBCLANG_PATH=/usr/lib/llvm-18/lib" >> "$GITHUB_ENV"
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config protobuf-compiler libssl-dev libfreetype-dev libexpat1-dev libgit2-dev libfontconfig1-dev libasound2-dev libclang-18-dev libxkbcommon-dev libwayland-dev libxcb1-dev libx11-dev libxi-dev libxcursor-dev
      - name: Windows build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress
          "LIBCLANG_PATH=C:\Program Files\LLVM\bin" >> $env:GITHUB_ENV
      - name: macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install protobuf pkg-config brotli
          # Bindgen and its builtin headers must come from the same Xcode toolchain.
          clang_path="$(xcrun --find clang)"
          clang_lib="$(dirname "$clang_path")/../lib"
          test -f "$clang_lib/libclang.dylib"
          echo "CLANG_PATH=$clang_path" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$clang_lib" >> "$GITHUB_ENV"
          echo "MACOSX_DEPLOYMENT_TARGET=11.0" >> "$GITHUB_ENV"
      - name: Install Rust
        shell: bash
        run: |
          rustup show active-toolchain
          rustc --version
          test "$(rustc -vV | sed -n 's/host: //p')" = '${{ matrix.host }}'
      - name: Test local runbook discovery
        shell: bash
        run: |
          mkdir -p target
          rustc --edition=2024 --test app/src/local_runbooks/catalog.rs -o target/runbook-tests
          ./target/runbook-tests
      - name: Build Warpeer
        shell: bash
        run: cargo build --locked -p warp --bin warpeer --no-default-features --features warpeer --profile release-desktop
      - name: Package archive and checksum
        shell: bash
        run: python3 script/warpeer/package-desktop.py ${{ matrix.platform }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: warpeer-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
