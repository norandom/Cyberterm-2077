name: Desktop builds
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/v') }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.12'
          verb: call
          args: checks --source=.

  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        with:
          version: '0.21.12'
          verb: call
          args: linux --source=. --tag=${{ github.ref_name }} --public-key=${{ vars.WARPEER_UPDATE_PUBLIC_KEY }} export --path=./build/artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyberterm2077-linux-x86_64
          path: build/artifacts/*
          if-no-files-found: error
          retention-days: 14

  native:
    name: ${{ matrix.platform }} ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: windows
            arch: x86_64
          - os: macos-15
            platform: macos
            arch: aarch64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    env:
      GIT_RELEASE_TAG: ${{ github.ref_name }}
      WARPEER_UPDATE_PUBLIC_KEY: ${{ vars.WARPEER_UPDATE_PUBLIC_KEY }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      # Native Apple SDK / hdiutil and MSVC cannot run in Dagger's Linux containers.
      - name: Native build, tests, and installer
        run: python3 script/warpeer/ci-native.py ${{ matrix.platform }} --install-deps --smoke-installers
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cyberterm2077-${{ matrix.platform }}-${{ matrix.arch }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  release:
    needs: [checks, linux, native]
    if: github.repository == 'norandom/Cyberterm-2077' && startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
    concurrency:
      group: warpeer-release-publication
      cancel-in-progress: false
    env:
      GIT_RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: cyberterm2077-*
          path: build/unsigned
          merge-multiple: true
      - name: Sign and verify release through Dagger
        uses: dagger/dagger-for-github@27b130bf0f79a7f6fbbbe0fbca6760dc9bb40a77 # v8.4.1
        env:
          WARPEER_RELEASE_SIGNING_KEY: ${{ secrets.WARPEER_RELEASE_SIGNING_KEY }}
        with:
          version: '0.21.12'
          verb: call
          args: sign --source=. --artifacts=build/unsigned --tag=${{ github.ref_name }} --public-key=${{ vars.WARPEER_UPDATE_PUBLIC_KEY }} --signing-key=env:WARPEER_RELEASE_SIGNING_KEY export --path=build/signed
      - name: Publish signed release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GIT_RELEASE_TAG" build/signed/* --verify-tag --draft --title "Cyberterm 2077 $GIT_RELEASE_TAG" --generate-notes
          gh release edit "$GIT_RELEASE_TAG" --draft=false --latest
